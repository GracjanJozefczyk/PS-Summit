sylius_grid:
    grids:
        app_admin_brand:
            driver:
                name: doctrine/orm
                options:
                    class: '%app.model.brand.class%'
            sorting:
                name: asc
            fields:
                code:
                    type: twig
                    label: sylius.ui.code
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/code.html.twig'
                name:
                    type: string
                    label: sylius.ui.name
                    sortable: ~
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/boolean.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
                            td_class: 'text-center'
            filters:
                search:
                    type: string
                    label: sylius.ui.search
                    options:
                        fields: [code, name]
                enabled:
                    type: boolean
                    label: sylius.ui.enabled
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete

        sylius_admin_product:
            filters:
                brand:
                    type: entity
                    label: app.ui.brand
                    form_options:
                        class: '%app.model.brand.class%'
                    options:
                        fields: [variants.brand.id]

        sylius_admin_product_variant:
            fields:
                brand:
                    type: twig
                    label: app.ui.brand
                    path: brand
                    options:
                        template: 'admin/product_variant/grid/field/brand.html.twig'
            filters:
                brand:
                    type: entity
                    label: app.ui.brand
                    form_options:
                        class: '%app.model.brand.class%'
                    options:
                        fields: [brand.id]
