# @see https://stack.sylius.com/resource/index
sylius_resource:
    # Override default settings
    #settings:

    # Configure the mapping for your resources
    mapping:
        paths:
            - '%kernel.project_dir%/src/Entity'

    # Configure your resources
    resources:
        app.brand:
            classes:
                model: App\Entity\Brand\Brand
                repository: App\Repository\BrandRepository
                form: App\Form\Type\Brand\BrandType
            translation:
                classes:
                    model: App\Entity\Brand\BrandTranslation
        app.brand_image:
            classes:
                model: App\Entity\Brand\BrandImage
