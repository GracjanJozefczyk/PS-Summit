# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']
        
    App\Form\Extension\ProductVariantTypeExtension:
        arguments:
            - '%app.model.brand.class%'
        tags:
            - { name: form.type_extension }
    
    app.twig.component.shop.brand_list:
        class: App\TwigComponent\Shop\BrandListComponent
        arguments:
            - '@app.repository.brand'
        tags:
            - { name: sylius.twig_component, key: 'app_shop:brand:list' }

    App\Form\Type\Brand\BrandType:
        arguments:
            - '%app.model.brand.class%'
            - ['sylius']
        tags:
            - { name: form.type }

    App\Form\Type\Brand\BrandTranslationType:
        arguments:
            - '%app.model.brand_translation.class%'
            - ['sylius']
        tags:
            - { name: form.type }

    App\Form\Type\Brand\BrandImageType:
        arguments:
            - '%app.model.brand_image.class%'
            - ['sylius']
        tags:
            - { name: form.type }

    app.twig.component.brand.form:
        class: Sylius\Bundle\UiBundle\Twig\Component\ResourceFormComponent
        autoconfigure: false
        arguments:
            - '@app.repository.brand'
            - '@form.factory'
            - '%app.model.brand.class%'
            - App\Form\Type\Brand\BrandType
        tags:
            - { name: sylius.live_component.admin, key: 'app_admin:brand:form' }

    app.listener.brand_images_upload:
        class: Sylius\Bundle\CoreBundle\EventListener\ImagesUploadListener
        arguments:
            - '@sylius.uploader.image'
        tags:
            - { name: kernel.event_listener, event: app.brand.pre_create, method: uploadImages }
            - { name: kernel.event_listener, event: app.brand.pre_update, method: uploadImages }
